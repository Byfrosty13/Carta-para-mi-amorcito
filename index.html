<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una cita especial</title>

<!--
  ============================================================================
  CÓMO EDITAR ESTA INVITACIÓN
  ============================================================================
  Baja hasta "////// CONFIG //////" dentro del <script> al final del archivo.
  Ahí puedes cambiar: cuántos meses cumplen, el día, la hora, el lugar,
  el mensaje y la lista de qué llevar. No hace falta tocar nada más.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=EB+Garamond:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">

<style>
  :root{
    --night-top:#0c1229;
    --night-mid:#1a2447;
    --night-bottom:#2c3866;
    --moon:#f4ecd8;
    --moon-glow:rgba(244,236,216,0.35);
    --pumpkin:#e8802e;
    --pumpkin-dark:#b85c1c;
    --sand:#e9d6ad;
    --ink:#f4ecd8;
    --ink-soft:#c9d1e8;
    --accent:#ff9a5a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'EB Garamond', serif;
    background: var(--night-top);
    color: var(--ink);
    overflow-x:hidden;
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 18px;
    background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-bottom) 100%);
    overflow:hidden;
  }

  /* ---------- stars ---------- */
  .stars{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px; height:2px;
    background: var(--ink);
    border-radius:50%;
    opacity:0.7;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.25; }
    50%{ opacity:0.9; }
  }

  /* ---------- moon ---------- */
  .moon{
    position:absolute;
    top: 6%;
    right: 10%;
    width: 120px; height:120px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fffaf0, var(--moon) 55%, #d8cba6 100%);
    box-shadow: 0 0 70px 20px var(--moon-glow), 0 0 140px 60px rgba(244,236,216,0.15);
  }
  .moon::before, .moon::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background: rgba(180,165,130,0.35);
  }
  .moon::before{ width:22px; height:22px; top:20px; left:26px; }
  .moon::after{ width:14px; height:14px; top:60px; left:70px; }

  /* ---------- bats ---------- */
  .bat{
    position:absolute;
    width: 26px; height:12px;
    opacity:0.8;
    animation: fly 7s ease-in-out infinite;
  }
  .bat svg{ width:100%; height:100%; fill: #14101c; }
  @keyframes fly{
    0%,100%{ transform: translateY(0) translateX(0) rotate(0deg); }
    50%{ transform: translateY(-14px) translateX(10px) rotate(-6deg); }
  }

  /* ---------- palms ---------- */
  .palm{
    position:absolute;
    bottom: 22%;
    opacity:0.55;
  }
  .palm svg{ width:90px; height:140px; }

  /* ---------- waves / sand ---------- */
  .shore{
    position:absolute;
    bottom:0; left:0; right:0;
    height: 22%;
  }
  .shore svg{ width:100%; height:100%; display:block; }

  /* ---------- card ---------- */
  .card{
    position:relative;
    z-index:5;
    width:min(440px, 92vw);
    background: rgba(12,18,41,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(244,236,216,0.25);
    border-radius: 14px;
    padding: 38px 30px 32px;
    text-align:center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55);
  }

  .badge{
    font-family:'Pirata One', cursive;
    font-size: 15px;
    letter-spacing:3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .card h1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-style: italic;
    font-size: clamp(26px, 6vw, 34px);
    margin: 0 0 4px 0;
    line-height:1.2;
    color: var(--ink);
  }

  .months{
    font-family:'Playfair Display', serif;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .months b{ color: var(--accent); font-weight:700; }

  .divider{
    width:56px; height:1px;
    background: rgba(244,236,216,0.35);
    margin: 0 auto 22px auto;
    position:relative;
  }
  .divider::after{
    content:"🖤";
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    font-size:12px;
    background: transparent;
  }

  .message{
    font-size: 17px;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 26px;
  }

  .details{
    text-align:left;
    background: rgba(244,236,216,0.06);
    border: 1px solid rgba(244,236,216,0.15);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .detail-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding: 7px 0;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .detail-row + .detail-row{
    border-top: 1px dashed rgba(244,236,216,0.12);
  }
  .detail-row .icon{ font-size:16px; width:20px; flex-shrink:0; }
  .detail-row .label{ color: var(--accent); font-weight:600; margin-right:4px; }

  .bring-title{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .bring-list{
    list-style:none;
    padding:0; margin: 0 0 26px 0;
    text-align:left;
    font-size: 15px;
    color: var(--ink-soft);
    line-height:1.9;
  }
  .bring-list li::before{
    content:"🕯️ ";
  }

  .rsvp-btn{
    font-family:'EB Garamond', serif;
    font-size: 16px;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--pumpkin), var(--pumpkin-dark));
    color: #1a1206;
    border:none;
    padding: 13px 28px;
    border-radius: 30px;
    cursor:pointer;
    font-weight:600;
    box-shadow: 0 10px 24px rgba(232,128,46,0.35);
    transition: transform .2s ease;
  }
  .rsvp-btn:hover{ transform: translateY(-2px) scale(1.02); }
  .rsvp-btn:disabled{ opacity:0.7; cursor:default; transform:none; }

  .rsvp-note{
    margin-top:14px;
    font-size: 13px;
    color: var(--ink-soft);
    opacity:0;
    transition: opacity .4s ease;
  }
  .rsvp-note.show{ opacity:0.9; }
</style>
</head>
<body>

<div class="scene">
  <div class="stars" id="stars"></div>

  <div class="moon"></div>

  <div class="bat" style="top:18%; left:12%; animation-delay:0s;">
    <svg viewBox="0 0 60 24"><path d="M30 6c-3-6-14-8-20 0 4-1 9 1 12 5-6-1-11 2-13 6 5 0 9-2 11-5 2 3 6 5 11 5-2-4-7-7-13-6 3-4 8-6 12-5-6-8-17-6-20 0"/></svg>
  </div>
  <div class="bat" style="top:28%; left:22%; animation-delay:1.4s; width:18px;">
    <svg viewBox="0 0 60 24"><path d="M30 6c-3-6-14-8-20 0 4-1 9 1 12 5-6-1-11 2-13 6 5 0 9-2 11-5 2 3 6 5 11 5-2-4-7-7-13-6 3-4 8-6 12-5-6-8-17-6-20 0"/></svg>
  </div>
  <div class="bat" style="top:14%; left:32%; animation-delay:2.8s; width:20px;">
    <svg viewBox="0 0 60 24"><path d="M30 6c-3-6-14-8-20 0 4-1 9 1 12 5-6-1-11 2-13 6 5 0 9-2 11-5 2 3 6 5 11 5-2-4-7-7-13-6 3-4 8-6 12-5-6-8-17-6-20 0"/></svg>
  </div>

  <div class="palm" style="left:4%;">
    <svg viewBox="0 0 90 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M45 140 L45 55" stroke="#14101c" stroke-width="5"/>
      <path d="M45 55 C20 45 10 25 5 10" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C25 50 8 45 2 45" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C60 40 75 20 85 8" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C65 50 82 48 88 50" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C40 35 35 18 32 5" stroke="#14101c" stroke-width="5" fill="none"/>
    </svg>
  </div>
  <div class="palm" style="right:4%;">
    <svg viewBox="0 0 90 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M45 140 L45 55" stroke="#14101c" stroke-width="5"/>
      <path d="M45 55 C20 45 10 25 5 10" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C25 50 8 45 2 45" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C60 40 75 20 85 8" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C65 50 82 48 88 50" stroke="#14101c" stroke-width="5" fill="none"/>
      <path d="M45 55 C40 35 35 18 32 5" stroke="#14101c" stroke-width="5" fill="none"/>
    </svg>
  </div>

  <div class="shore">
    <svg viewBox="0 0 500 100" preserveAspectRatio="none">
      <path d="M0,40 C100,20 150,60 250,40 C350,20 400,55 500,35 L500,100 L0,100 Z" fill="#3a4a80" opacity="0.55"/>
      <path d="M0,60 C120,45 180,75 260,58 C360,40 420,70 500,55 L500,100 L0,100 Z" fill="#e9d6ad"/>
    </svg>
  </div>

  <div class="card" id="card"></div>
</div>

<script>
/* ============================================================================
   ////// CONFIG //////
   
   ============================================================================ */
const CONFIG = {
  badge: "Cita especial",
  titulo: "Te invito a una cita",
  meses: 2,                         
  dia: "Este Sabado",              
  hora: "5:00 PM",
  lugar: "Limon 🌊",
  mensaje: "Eres el instante bonito del día,el pensamiento que me hace sonreír,la luz sencilla que todo lo guíay la razón más dulce de existir.Te quiero así, sin prisa y sin medida ,Cumplimos meses saliendo y quiero celebrarlo contigo como se debe: descalzos, con la marea sonando y algo de misterio en el aire. Ven a pasar la tarde conmigo.",
  llevar: [
    "Tu hermosa existencia",
    "Una mantita para la playa",
    "Ganas de que nos dé frío o calor juntitos",
  ],
  textoBoton: "Cuenta conmigo 🖤",
  notaConfirmacion: "Perfecto... nos vemos ahí 🌙",
};

function render(){
  const card = document.getElementById('card');
  const items = CONFIG.llevar.map(i => `<li>${i}</li>`).join('');
  card.innerHTML = `
    <div class="badge">${CONFIG.badge}</div>
    <h1>${CONFIG.titulo}</h1>
    <div class="months">Cumplimos <b>${CONFIG.meses} meses</b> saliendo 🖤</div>
    <div class="divider"></div>
    <p class="message">${CONFIG.mensaje}</p>
    <div class="details">
      <div class="detail-row"><span class="icon">🗓️</span><span><span class="label">Cuándo:</span>${CONFIG.dia}, ${CONFIG.hora}</span></div>
      <div class="detail-row"><span class="icon">📍</span><span><span class="label">Dónde:</span>${CONFIG.lugar}</span></div>
    </div>
    <div class="bring-title">Trae contigo</div>
    <ul class="bring-list">${items}</ul>
    <button class="rsvp-btn" id="rsvp">${CONFIG.textoBoton}</button>
    <div class="rsvp-note" id="rsvp-note">${CONFIG.notaConfirmacion}</div>
  `;
  document.getElementById('rsvp').addEventListener('click', function(){
    this.disabled = true;
    this.textContent = "Confirmado ✓";
    document.getElementById('rsvp-note').classList.add('show');
  });
}

function makeStars(){
  const container = document.getElementById('stars');
  let html = '';
  for(let i=0;i<50;i++){
    const top = Math.random()*70;
    const left = Math.random()*100;
    const delay = (Math.random()*3.5).toFixed(2);
    html += `<div class="star" style="top:${top}%; left:${left}%; animation-delay:${delay}s;"></div>`;
  }
  container.innerHTML = html;
}

render();
makeStars();
</script>
</body>
</html>
