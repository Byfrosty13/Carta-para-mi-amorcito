<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💜</title>

<!--
  ============================================================================
  CÓMO EDITAR ESTA PÁGINA
  ============================================================================
  Baja hasta "////// CONFIG //////" dentro del <script> al final del archivo.
  Ahí cambias los textos: el título de la portada, cada línea del mensaje,
  el "Te amo" final, el texto del medidor y tu firma. Nada más.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600;1,700&family=Caveat:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#3a3366;
    --ink-soft:#6a62a0;
    --heart:#e0607e;
    --periwinkle:#7a93ec;
    --lilac:#b58be8;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #e8ecff 0%, #f4ebfb 52%, #fdf0f1 100%) fixed;
    overflow-x:hidden;
  }

  /* ================= PORTADA ================= */
  .intro{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:24px;
    background: linear-gradient(160deg, #e8ecff 0%, #f4ebfb 52%, #fdf0f1 100%);
    transition: opacity .9s ease, visibility .9s ease;
  }
  .intro.hide{ opacity:0; visibility:hidden; }
  .intro .emoji{ font-size:44px; animation: bob 2.8s ease-in-out infinite; }
  .intro h1{
    font-family:'Fraunces', serif; font-style:italic; font-weight:700;
    font-size: clamp(32px, 9vw, 50px); margin:0; line-height:1.15;
  }
  .intro p{ margin:0; color:var(--ink-soft); max-width: 30ch; line-height:1.6; }

  .pill{
    font-family:'Nunito', sans-serif; font-weight:600; font-size:17px;
    color:#fff; border:none; cursor:pointer;
    padding: 14px 32px; border-radius:40px;
    background: linear-gradient(135deg, #8b9cf0, #b58be8 60%, #e98bb0);
    box-shadow: 0 12px 28px rgba(122,110,200,.4);
    transition: transform .2s ease;
  }
  .pill:hover{ transform: translateY(-2px) scale(1.03); }
  .pulse{ animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 12px 28px rgba(122,110,200,.4), 0 0 0 0 rgba(181,139,232,.5); }
    50%{ box-shadow: 0 12px 28px rgba(122,110,200,.4), 0 0 0 14px rgba(181,139,232,0); }
  }

  /* ================= JARDÍN DE HORTENSIAS ================= */
  .garden{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .hy{
    position:absolute;
    width: clamp(170px, 36vw, 340px);
    aspect-ratio:1;
    transform-origin: 50% 100%;
    animation: sway 7s ease-in-out infinite alternate;
  }
  .hy svg{ width:100%; height:100%; display:block; overflow:visible; }
  .hy1{ left:-46px;  bottom:-70px; }
  .hy2{ right:-56px; bottom:-84px; animation-delay:-3s; }
  .hy3{ right:-46px; top:-70px; width: clamp(120px, 24vw, 230px); animation-delay:-1.5s; }
  .hy3 svg{ transform: rotate(165deg); }
  .hy4{ left:-60px; top:34%; width: clamp(100px, 18vw, 180px); animation-delay:-5s; opacity:.95; }
  @keyframes sway{
    0%{ transform: rotate(-2.2deg); }
    100%{ transform: rotate(2.4deg); }
  }

  .fl{
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .9s cubic-bezier(.2,1.5,.4,1) var(--d, 0ms);
  }
  .fl circle{ stroke: rgba(255,255,255,.4); stroke-width:.7; }
  .fl circle.core{ stroke:none; }
  .leaf{ opacity:0; transition: opacity 1.2s ease .2s; }
  body.open .fl{ transform: scale(1); }
  body.open .leaf{ opacity:1; }

  /* ================= PÉTALOS ================= */
  .petals{ position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; opacity:0; transition: opacity 2s ease 1.5s; }
  body.open .petals{ opacity:1; }
  .petal{
    position:absolute; top:0;
    border-radius: 70% 0 70% 0;
    opacity:.8;
    animation: fall linear infinite;
  }
  @keyframes fall{
    0%{ transform: translate3d(0,-12vh,0) rotate(0deg); }
    100%{ transform: translate3d(var(--dx), 112vh, 0) rotate(560deg); }
  }

  /* ================= ESCENA ================= */
  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 36px 16px 90px;
    gap: 20px;
  }

  .elephants{
    position:relative; display:flex; justify-content:center;
    width: min(560px, 96vw);
  }
  .ele{
    width:50%; max-width:268px;
    opacity:0;
    transition: opacity .7s ease, transform 2.4s cubic-bezier(.2,.8,.2,1);
  }
  .ele.left{ transform: translateX(-95%); }
  .ele.right{ transform: translateX(95%); }
  body.open .ele{ opacity:1; transform:none; }

  .ele svg{ display:block; width:100%; height:auto; overflow:visible; animation: bob 3.4s ease-in-out infinite; }
  .ele.right svg{ transform: scaleX(-1); animation-delay:-1.6s; }
  @keyframes bob{
    0%,100%{ translate: 0 0; }
    50%{ translate: 0 -5px; }
  }
  .ear{ transform-origin: 170px 66px; animation: flap 2.6s ease-in-out infinite; }
  @keyframes flap{ 0%,100%{ transform: rotate(0deg); } 50%{ transform: rotate(-10deg); } }
  .trunk{ transform-origin: 214px 98px; animation: trunk 3.1s ease-in-out infinite; }
  @keyframes trunk{ 0%,100%{ transform: rotate(-3deg); } 50%{ transform: rotate(3deg); } }
  .tail{ transform-origin: 50px 110px; animation: tail 2.2s ease-in-out infinite; }
  @keyframes tail{ 0%,100%{ transform: rotate(6deg); } 50%{ transform: rotate(-8deg); } }

  .love{
    position:absolute; left:50%; top:7%;
    width: clamp(34px, 8.5vw, 54px);
    transform: translateX(-50%);
    opacity:0; transition: opacity 1s ease 2s;
    filter: drop-shadow(0 6px 10px rgba(224,96,126,.35));
  }
  body.open .love{ opacity:1; }
  .love svg{ width:100%; display:block; animation: beat 1.25s ease-in-out infinite; }
  @keyframes beat{
    0%,100%{ transform: scale(1); }
    18%{ transform: scale(1.22); }
    36%{ transform: scale(1); }
    54%{ transform: scale(1.14); }
  }
  .mini{ position:absolute; top:4%; font-size:15px; pointer-events:none; }

  /* ================= TARJETA DEL MENSAJE ================= */
  .card{
    width: min(560px, 94vw);
    padding: 30px 26px 34px;
    border-radius: 26px;
    background: rgba(255,255,255,.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: 0 24px 56px rgba(90,80,160,.2);
    text-align:center;
    opacity:0; transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .card.on{ opacity:1; transform:none; }

  .kicker{
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size: 16px; color: var(--ink-soft);
    letter-spacing:.5px; margin-bottom: 22px;
  }

  .line{
    font-family:'Caveat', cursive; font-weight:600;
    font-size: clamp(24px, 5.8vw, 31px);
    line-height:1.35; margin: 0 0 18px 0;
    opacity:0; transform: translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .line.show{ opacity:1; transform:none; }

  .final{ margin-top: 10px; opacity:0; transition: opacity .6s ease; }
  .final.show{ opacity:1; }
  .te-amo{
    font-family:'Fraunces', serif; font-style:italic; font-weight:700;
    font-size: clamp(50px, 15vw, 82px);
    line-height:1.1; margin: 6px 0 4px;
    background: linear-gradient(90deg, #7a93ec, #b58be8 50%, #e0607e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .te-amo span{ display:inline-block; opacity:0; }
  .final.show .te-amo span{
    animation: pop .75s cubic-bezier(.2,1.6,.4,1) forwards;
    animation-delay: calc(var(--i) * .15s);
  }
  @keyframes pop{
    0%{ opacity:0; transform: scale(.3) translateY(14px); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  .te-amo-heart{ font-size: 30px; display:inline-block; opacity:0; }
  .final.show .te-amo-heart{ animation: pop .8s cubic-bezier(.2,1.6,.4,1) 1.05s forwards, beat 1.25s ease-in-out 1.9s infinite; }

  .ask{ margin-top: 22px; opacity:0; visibility:hidden; transition: opacity .8s ease; }
  .ask.show{ opacity:1; visibility:visible; }

  /* ================= MEDIDOR ================= */
  .meter{ display:none; margin-top: 24px; }
  .meter.show{ display:block; animation: fadeIn .8s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none;} }

  .bar{
    position:relative; height:26px; border-radius:20px;
    background: rgba(122,110,200,.16);
    box-shadow: inset 0 2px 6px rgba(90,80,160,.22);
    transition: transform .5s ease;
  }
  .fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    border-radius:20px;
    background: linear-gradient(90deg, #8b9cf0, #b58be8 55%, #ee7fa2);
  }
  .meter.over .bar{ transform: scale(1.04); }
  .meter.over .fill{
    box-shadow: 0 0 22px 6px rgba(224,96,126,.5);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer{ from{ background-position: 0 0; } to{ background-position: -200% 0; } }

  .count{
    font-family:'Fraunces', serif; font-style:italic; font-weight:700;
    font-size: 40px; margin-top: 14px; color: var(--ink);
    transition: transform .25s ease;
  }
  .count.bump{ transform: scale(1.25); }
  .meter.over .count{ font-size: 64px; color: var(--heart); }
  .caption{
    margin-top: 6px; min-height: 52px;
    font-family:'Caveat', cursive; font-weight:600; font-size: 26px; line-height:1.3;
    color: var(--ink-soft);
  }

  .firma{
    margin-top: 18px;
    font-family:'Fraunces', serif; font-style:italic; font-size: 18px;
    color: var(--heart);
    opacity:0; transition: opacity 1.4s ease;
  }
  .firma.show{ opacity:1; }

  /* ================= FOTO FINAL ================= */
  .photo{
    display:none;
    margin: 30px auto 0;
    width: min(340px, 86%);
    opacity:0; transform: translateY(16px) rotate(0deg);
    transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2,.9,.3,1);
  }
  .photo.ready{ display:block; }
  .photo.show{ opacity:1; transform: translateY(0) rotate(-2deg); }
  .polaroid{
    background:#fff;
    padding: 12px 12px 16px;
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(90,80,160,.28);
  }
  .polaroid img{
    display:block; width:100%; height:auto; max-height: 420px;
    object-fit:cover; border-radius:3px;
  }
  .polaroid .pie{
    margin-top: 12px;
    font-family:'Caveat', cursive; font-weight:600;
    font-size: 24px; line-height:1.25; color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .hy, .ele svg, .ear, .trunk, .tail, .love svg, .pulse, .petal{ animation:none !important; }
    .petals{ display:none; }
  }
</style>
</head>
<body>

<!-- PORTADA -->
<div class="intro" id="intro">
  <div class="emoji">🐘</div>
  <h1 id="introTitulo"></h1>
  <p id="introTexto"></p>
  <button class="pill pulse" id="openBtn"></button>
</div>

<!-- DECORACIÓN -->
<div class="garden" id="garden"></div>
<div class="petals" id="petals"></div>

<!-- CONTENIDO -->
<main class="stage">
  <div class="elephants" id="elephants">
    <div class="ele left" id="eleHer"></div>
    <div class="love">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f08aab"/>
            <stop offset="1" stop-color="#d94f74"/>
          </linearGradient>
        </defs>
        <path d="M12 21s-7.5-4.9-10.1-9.3C.3 8.6 1.7 5 5.2 4.2c2-.5 4 .3 5 2 1-1.7 3-2.5 5-2 3.5.8 4.9 4.4 3.3 7.5C19.5 16.1 12 21 12 21z" fill="url(#hg)"/>
      </svg>
    </div>
    <div class="ele right" id="eleHim"></div>
  </div>

  <section class="card" id="card">
    <div class="kicker" id="kicker"></div>
    <div id="lines"></div>

    <div class="final" id="final">
      <div class="te-amo" id="teAmo"></div>
      <span class="te-amo-heart">💜</span>
    </div>

    <div class="ask" id="ask">
      <button class="pill" id="askBtn"></button>
    </div>

    <div class="meter" id="meter">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="count" id="count">0%</div>
      <div class="caption" id="caption"></div>
    </div>

    <div class="firma" id="firma"></div>

    <figure class="photo" id="photo" style="margin-left:auto;margin-right:auto;">
      <div class="polaroid">
        <img id="photoImg" alt="Nosotros">
        <div class="pie" id="photoPie"></div>
      </div>
    </figure>
  </section>
</main>

<script>
/* ============================================================================
   ////// CONFIG //////
   Cambia aquí los textos. Cada frase de "lineas" aparece una por una.
   ============================================================================ */
const CONFIG = {
  introTitulo: "Tengo algo para ti Dani 💜",
  introTexto: "Lo hice con mucho cariño. Ábrelo con calma ,entiendo que te hizo dudar de mí. Lo siento mucho. Cuando te digo que eres hermosa, lo digo de verdad",
  botonIntro: "Ábrelo 💜",

  encabezado: "Para ti, mi amor",

  lineas: [
    "Hay cosas que me da nervio decirte en voz alta, así que las dejé aquí, con calma.",
    "Me gustas muchísimo. Mucho, mucho. De esas veces en que uno ya no sabe cómo explicarlo.",
    "Me gusta tu risa, tus historias, y cómo logras que hasta un día cualquiera se sienta especial.",
    "Dicen que los elefantes nunca olvidan. Yo tampoco quiero olvidar ni un solo momento contigo.",
    "Y las hortensias cambian de color según la tierra en la que crecen. Contigo, a mí me cambió todo: estoy más feliz, más tranquilo, más yo.",
    "Gracias por ser tú. Gracias por quedarte.",
  ],

  teAmo: "Te amo",

  botonPregunta: "¿Cuánto me gustas? 💜",
  textoMedidor: "No cabe en un número. Me gustas mucho, mucho, mucho… y te amo más de lo que sé decir.",

  firma: "Isaac Z 💜",

  // FOTO FINAL (opcional): pon aquí la ruta de tu imagen.
  // Ejemplo: "fotos/nosotros.jpg"  -> guárdala en una carpeta "fotos"
  // junto a este archivo. Si lo dejas vacío "" no se muestra nada.
  foto: "fotos/nosotros.png",
  pieDeFoto: "Tú y yo 💜",
};

/* ============================================================================
   A partir de aquí es el motor de la página. No hace falta tocarlo.
   ============================================================================ */

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Elefante ---------- */
function elephant(o){
  return `
  <svg viewBox="0 0 260 210" style="--body:${o.body};--dark:${o.dark};--ear:${o.ear}" aria-hidden="true">
    <ellipse cx="128" cy="199" rx="92" ry="7" fill="rgba(70,60,130,.14)"/>
    <path class="tail" d="M50 110 C32 112 26 134 34 148" fill="none" stroke="var(--dark)" stroke-width="7" stroke-linecap="round"/>
    <rect x="58"  y="136" width="32" height="58" rx="14" fill="var(--dark)"/>
    <rect x="140" y="136" width="32" height="58" rx="14" fill="var(--dark)"/>
    <ellipse cx="116" cy="116" rx="78" ry="54" fill="var(--body)"/>
    <rect x="84"  y="142" width="34" height="53" rx="15" fill="var(--body)"/>
    <rect x="164" y="142" width="34" height="53" rx="15" fill="var(--body)"/>
    <path class="trunk" d="M216 98 C248 98 254 64 240 42" fill="none" stroke="var(--body)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="190" cy="88" r="42" fill="var(--body)"/>
    <g class="ear">
      <ellipse cx="166" cy="96" rx="25" ry="35" fill="var(--ear)"/>
      <ellipse cx="167" cy="98" rx="15" ry="24" fill="#fff" opacity=".25"/>
    </g>
    <circle cx="203" cy="80" r="4.2" fill="#2b2550"/>
    <circle cx="204.3" cy="78.7" r="1.4" fill="#fff"/>
    <circle cx="200" cy="100" r="6.5" fill="#f4a9c4" opacity=".6"/>
    ${o.extra || ''}
  </svg>`;
}

const flowerOnHead = `
  <g>
    <circle cx="180" cy="52" r="7.5" fill="#f0b5d3"/>
    <circle cx="191" cy="48" r="7.5" fill="#c7a6ee"/>
    <circle cx="187" cy="59" r="7.5" fill="#8fa6f2"/>
    <circle cx="186" cy="53" r="2.4" fill="#f4efc4"/>
  </g>`;

const bowtie = `
  <g>
    <polygon points="160,118 177,128 160,138" fill="#7a93ec"/>
    <polygon points="194,118 177,128 194,138" fill="#7a93ec"/>
    <circle cx="177" cy="128" r="4.5" fill="#5a73d0"/>
  </g>`;

/* ---------- Hortensia ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const PALETTE = ['#7a93ec','#8fa6f2','#a4b4f6','#b6a6f1','#c7a6ee','#dca9e4','#efb3d2'];

function hydrangea(seed, flip){
  const rnd = mulberry32(seed);
  const cx = 150, cy = 132, R = 104, n = 66;
  const items = [];
  for(let i = 1; i <= n; i++){
    const r = R * Math.sqrt(i / n);
    const th = i * 2.39996 + rnd() * .3;
    const x = cx + r * Math.cos(th);
    const y = cy + r * Math.sin(th) * .92;
    let k = ((x - cx) / R) * .5 + .5;
    if(flip) k = 1 - k;
    k = Math.min(.999, Math.max(0, k * .85 + rnd() * .3));
    items.push({
      x, y, r,
      col: PALETTE[Math.floor(k * PALETTE.length)],
      fr: 15.5 - 4 * (r / R),
      rot: rnd() * 90,
      d: Math.round((r / R) * 1100 + rnd() * 250),
    });
  }
  items.sort((a, b) => b.r - a.r);

  const leaves = `
    <g class="leaf">
      <path d="M150 240 C150 270 150 290 150 300" stroke="#6aa488" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="92"  cy="228" rx="62" ry="26" transform="rotate(-22 92 228)"  fill="#76b08f"/>
      <ellipse cx="208" cy="228" rx="62" ry="26" transform="rotate(22 208 228)"  fill="#6aa488"/>
      <ellipse cx="110" cy="256" rx="48" ry="19" transform="rotate(-8 110 256)" fill="#8bc2a2"/>
      <ellipse cx="190" cy="256" rx="48" ry="19" transform="rotate(8 190 256)"  fill="#7fb899"/>
      <path d="M40 212 L130 238 M260 212 L170 238" stroke="#5c9478" stroke-width="1.6" opacity=".6"/>
    </g>`;

  const florets = items.map(it => {
    const o = it.fr * .5, pr = it.fr * .58;
    return `<g transform="translate(${it.x.toFixed(1)} ${it.y.toFixed(1)}) rotate(${it.rot.toFixed(0)})">
      <g class="fl" style="--d:${it.d}ms">
        <circle cx="${o}"  cy="0"    r="${pr}" fill="${it.col}"/>
        <circle cx="${-o}" cy="0"    r="${pr}" fill="${it.col}"/>
        <circle cx="0"     cy="${o}" r="${pr}" fill="${it.col}"/>
        <circle cx="0"     cy="${-o}" r="${pr}" fill="${it.col}"/>
        <circle class="core" r="${(it.fr * .17).toFixed(1)}" fill="#f4efc4"/>
      </g>
    </g>`;
  }).join('');

  return `<svg viewBox="0 0 300 300" aria-hidden="true">${leaves}${florets}</svg>`;
}

/* ---------- Armar todo ---------- */
function build(){
  $('#introTitulo').textContent = CONFIG.introTitulo;
  $('#introTexto').textContent  = CONFIG.introTexto;
  $('#openBtn').textContent     = CONFIG.botonIntro;

  $('#eleHer').innerHTML = elephant({ body:'#c9b9ee', dark:'#b3a1de', ear:'#e8bfe0', extra: flowerOnHead });
  $('#eleHim').innerHTML = elephant({ body:'#aebcf0', dark:'#97a7e6', ear:'#c9d3fa', extra: bowtie });

  $('#garden').innerHTML = `
    <div class="hy hy1">${hydrangea(11, false)}</div>
    <div class="hy hy2">${hydrangea(27, true)}</div>
    <div class="hy hy3">${hydrangea(5,  false)}</div>
    <div class="hy hy4">${hydrangea(42, true)}</div>`;

  const colors = ['#b6a6f1','#a4b4f6','#efb3d2','#c7a6ee','#8fa6f2'];
  let petals = '';
  for(let i = 0; i < 26; i++){
    const s = 9 + Math.random() * 9;
    const dx = (Math.random() * 160 - 80).toFixed(0);
    const dur = (10 + Math.random() * 10).toFixed(1);
    const del = (-Math.random() * 20).toFixed(1);
    petals += `<div class="petal" style="left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${(s*1.3).toFixed(1)}px;background:${colors[i % colors.length]};--dx:${dx}px;animation-duration:${dur}s;animation-delay:${del}s"></div>`;
  }
  $('#petals').innerHTML = petals;

  $('#kicker').textContent = CONFIG.encabezado;
  $('#lines').innerHTML = CONFIG.lineas.map(t => `<p class="line">${t}</p>`).join('');
  $('#teAmo').innerHTML = [...CONFIG.teAmo].map((ch, i) =>
    `<span style="--i:${i}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
  $('#askBtn').textContent = CONFIG.botonPregunta;
  $('#firma').textContent = CONFIG.firma;

  if(CONFIG.foto){
    const img = $('#photoImg');
    img.onload = () => $('#photo').classList.add('ready');
    img.onerror = () => $('#photo').remove();
    img.src = CONFIG.foto;
    $('#photoPie').textContent = CONFIG.pieDeFoto || '';
  } else {
    $('#photo').remove();
  }
}

/* ---------- Corazoncitos que suben ---------- */
function miniHearts(){
  const host = $('#elephants');
  const faces = ['💜','💙','🤍','💗'];
  setInterval(() => {
    if(document.hidden) return;
    const s = document.createElement('span');
    s.className = 'mini';
    s.textContent = faces[Math.floor(Math.random() * faces.length)];
    s.style.left = (46 + Math.random() * 8) + '%';
    host.appendChild(s);
    const drift = (Math.random() * 50 - 25).toFixed(0);
    s.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0 },
      { opacity: 1, offset: .25 },
      { transform: `translate(${drift}px,-90px) scale(1.1)`, opacity: 0 }
    ], { duration: 2800, easing: 'ease-out' }).onfinish = () => s.remove();
  }, 900);
}

/* ---------- Explosión de corazones ---------- */
function burst(){
  const r = $('.bar').getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const faces = ['💜','💙','🤍','🌸','🐘','💗'];
  for(let i = 0; i < 34; i++){
    const s = document.createElement('span');
    s.textContent = faces[i % faces.length];
    s.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;font-size:${16 + Math.random()*18}px;pointer-events:none;z-index:30`;
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2;
    const d = 90 + Math.random() * 190;
    s.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d - 60}px)) scale(1.2)`, opacity: 0 }
    ], { duration: 1600 + Math.random() * 900, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
  }
}

/* ---------- Medidor ---------- */
async function runMeter(){
  const meter = $('#meter'), fill = $('#fill'), num = $('#count'), cap = $('#caption');
  $('#ask').style.display = 'none';
  meter.classList.add('show');
  meter.scrollIntoView({ behavior:'smooth', block:'center' });
  await sleep(700);

  const dur = 2600, t0 = performance.now();
  await new Promise(res => {
    (function step(t){
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      fill.style.width = (e * 100) + '%';
      num.textContent = Math.round(e * 100) + '%';
      p < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });

  cap.textContent = 'Y todavía no termino…';
  await sleep(1200);

  for(const v of ['1.000%', '100.000%', '1.000.000%']){
    num.textContent = v;
    num.classList.add('bump');
    await sleep(220);
    num.classList.remove('bump');
    await sleep(520);
  }

  num.textContent = '∞';
  meter.classList.add('over');
  cap.textContent = CONFIG.textoMedidor;
  burst();
  await sleep(1800);
  $('#firma').classList.add('show');
  $('#firma').scrollIntoView({ behavior:'smooth', block:'center' });
  await sleep(1800);
  const ph = $('#photo');
  if(ph){
    ph.classList.add('show');
    ph.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

/* ---------- Secuencia principal ---------- */
async function start(){
  $('#intro').classList.add('hide');
  await sleep(600);
  document.body.classList.add('open');

  await sleep(2600);
  $('#card').classList.add('on');
  miniHearts();
  await sleep(1400);

  const lines = [...document.querySelectorAll('.line')];
  for(const el of lines){
    el.classList.add('show');
    el.scrollIntoView({ behavior:'smooth', block:'nearest' });
    await sleep(2200 + el.textContent.length * 30);
  }

  const fin = $('#final');
  fin.classList.add('show');
  fin.scrollIntoView({ behavior:'smooth', block:'center' });
  await sleep(2600);
  $('#ask').classList.add('show');
  $('#ask').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

build();
$('#openBtn').addEventListener('click', start);
$('#askBtn').addEventListener('click', runMeter);
</script>
